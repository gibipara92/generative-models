<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giambattista’s Favorite San Francisco</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--paper:#faf8f3;--ink:#181818;--muted:#6c6c68;--line:#e5dfd4}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}main{height:100%;display:grid;grid-template-columns:minmax(320px,400px) 1fr}.side{display:flex;flex-direction:column;min-width:0;background:rgba(250,248,243,.98);border-right:1px solid var(--line);box-shadow:8px 0 28px rgba(0,0,0,.07);z-index:500}.head{padding:27px 23px 14px}.eyebrow{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#777}h1{margin:0;font:500 32px/1.03 Georgia,serif;letter-spacing:-.025em}.intro{margin:11px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}.tools{padding:0 22px 13px}.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit}.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.filter{border:1px solid var(--line);border-radius:999px;background:white;padding:7px 9px;font-size:11px;font-weight:750;cursor:pointer}.filter:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}.filter.off{opacity:.4;filter:grayscale(1)}.list{overflow:auto;min-height:0;padding:0 12px 22px}.section{position:sticky;top:0;z-index:2;margin:0;padding:13px 10px 7px;background:linear-gradient(var(--paper) 75%,transparent);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#777}.item{display:grid;grid-template-columns:12px 1fr;gap:9px;width:100%;padding:10px;border:0;border-radius:12px;background:transparent;text-align:left;cursor:pointer}.item:hover,.item.active{background:white;box-shadow:0 2px 14px rgba(0,0,0,.07)}.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--c);box-shadow:0 0 0 2px white,0 0 0 3px rgba(0,0,0,.15)}.name{display:block;font-size:14px;font-weight:750;line-height:1.2}.note{display:block;margin-top:3px;font-size:12px;line-height:1.35;color:#777}.foot{padding:11px 22px calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:11px;color:#777}.mapwrap,#map{height:100%;min-width:0}.mapwrap{position:relative}.count{position:absolute;right:14px;top:14px;z-index:450;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.94);font-size:12px;font-weight:750;box-shadow:0 3px 18px rgba(0,0,0,.14)}.toggle{display:none}.pin{width:18px;height:18px;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.4)}.leaflet-popup-content-wrapper{border-radius:15px}.leaflet-popup-content{width:270px!important;margin:16px}.pcat{margin-bottom:6px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.popup h2{margin:0 0 7px;font:500 21px/1.08 Georgia,serif}.popup p{margin:6px 0;font-size:13px;line-height:1.4;color:#555}.popup .address{font-size:11px;color:#888}.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.links a{padding:7px 9px;border-radius:9px;background:#f1f0ec;color:#222;text-decoration:none;font-size:11px;font-weight:750}.empty{padding:25px;text-align:center;color:#777;font-size:13px}@media(max-width:760px){main{display:block}.side{position:absolute;inset:0 auto 0 0;width:min(88vw,380px);transform:translateX(-102%);transition:.2s}.side.open{transform:translateX(0)}.toggle{display:block;position:absolute;left:14px;top:14px;z-index:550;width:44px;height:44px;border:0;border-radius:13px;background:white;font-size:20px;box-shadow:0 4px 18px rgba(0,0,0,.2)}h1{font-size:30px}}
</style>
</head>
<body>
<main>
<aside class="side" id="side">
<header class="head"><p class="eyebrow">Personal city guide</p><h1>Giambattista’s Favorite San Francisco</h1><p class="intro" id="intro">Confirmed favorites: dramatic climbs, architecture, neighborhood walks, excellent pastry and the best City Guides tours.</p></header>
<div class="tools"><input id="search" class="search" type="search" placeholder="Search places…"><div id="filters" class="filters"></div></div>
<div id="list" class="list"></div><footer class="foot">Only places explicitly confirmed as favorites are included.</footer>
</aside>
<section class="mapwrap"><button class="toggle" id="toggle">☰</button><div id="count" class="count">Loading…</div><div id="map"></div></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
const ORDER=["Parks, Hills & Views","Neighborhood Walks","Architecture, Museums & Gardens","Food & Pastry","SF City Guides"];
const LABEL={"Parks, Hills & Views":"Parks, hills & views","Neighborhood Walks":"Neighborhood walks","Architecture, Museums & Gardens":"Architecture, museums & gardens","Food & Pastry":"Food & pastry","SF City Guides":"SF City Guides"};
const map=L.map('map',{zoomControl:false}).setView([37.781,-122.438],13);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let places=[],layers={},markers=new Map(),enabled=new Set(ORDER),active=-1;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pin=c=>L.divIcon({className:'',html:`<div class="pin" style="background:${c}"></div>`,iconSize:[18,18],iconAnchor:[9,9],popupAnchor:[0,-10]});
function popup(p){const official=p.official?`<a href="${esc(p.official)}" target="_blank" rel="noopener">Official page</a>`:'';return `<div class="popup"><div class="pcat" style="color:${p.color}">${esc(LABEL[p.category])}</div><h2>${esc(p.name)}</h2><p>${esc(p.note)}</p><p class="address">${esc(p.address)}</p><div class="links"><a href="${esc(p.maps)}" target="_blank" rel="noopener">Open in Google Maps</a>${official}</div></div>`}
function show(id){active=id;document.querySelectorAll('.item').forEach(e=>e.classList.toggle('active',+e.dataset.id===id));document.querySelector(`.item[data-id="${id}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'})}
function visible(){const q=document.getElementById('search').value.trim().toLowerCase();return places.filter(p=>enabled.has(p.category)&&(!q||`${p.name} ${p.note} ${p.address}`.toLowerCase().includes(q)))}
function render(){const root=document.getElementById('list'),v=visible();root.innerHTML='';for(const cat of ORDER){const rows=v.filter(p=>p.category===cat);if(!rows.length)continue;const h=document.createElement('h2');h.className='section';h.textContent=LABEL[cat];root.appendChild(h);for(const p of rows){const b=document.createElement('button');b.className='item'+(p.id===active?' active':'');b.dataset.id=p.id;b.innerHTML=`<span class="dot" style="--c:${p.color}"></span><span><span class="name">${esc(p.name)}</span><span class="note">${esc(p.note)}</span></span>`;b.onclick=()=>{map.setView([p.lat,p.lon],Math.max(map.getZoom(),15),{animate:true});markers.get(p.id).openPopup();show(p.id);if(innerWidth<=760)document.getElementById('side').classList.remove('open')};root.appendChild(b)}}if(!v.length)root.innerHTML='<div class="empty">No matching places.</div>';document.getElementById('count').textContent=`${v.length} ${v.length===1?'place':'places'}`}
Papa.parse('data.csv',{download:true,header:true,skipEmptyLines:true,complete:r=>{places=r.data.map((x,id)=>({id,name:x.Name,category:x.Category,color:x.Color,address:x['Location / Address'],lat:+x.Latitude,lon:+x.Longitude,note:x.Recommendation,maps:x['Google Maps'],official:x['Official / Tour Page']}));document.getElementById('intro').textContent=`${places.length} confirmed favorites: dramatic climbs, architecture, neighborhood walks, excellent pastry and the best City Guides tours.`;for(const cat of ORDER){layers[cat]=L.layerGroup().addTo(map);const c=places.find(p=>p.category===cat)?.color||'#777';const b=document.createElement('button');b.className='filter';b.style.setProperty('--c',c);b.textContent=LABEL[cat];b.onclick=()=>{if(enabled.has(cat)){enabled.delete(cat);map.removeLayer(layers[cat]);b.classList.add('off')}else{enabled.add(cat);layers[cat].addTo(map);b.classList.remove('off')}render()};document.getElementById('filters').appendChild(b)}for(const p of places){const m=L.marker([p.lat,p.lon],{icon:pin(p.color),title:p.name}).bindPopup(popup(p),{maxWidth:310}).addTo(layers[p.category]);m.on('click',()=>show(p.id));markers.set(p.id,m)}render();map.fitBounds(L.latLngBounds(places.map(p=>[p.lat,p.lon])).pad(.08))},error:e=>{document.getElementById('count').textContent='Unavailable';document.getElementById('list').innerHTML='<div class="empty">The map data could not be loaded.</div>';console.error(e)}});
document.getElementById('search').addEventListener('input',render);document.getElementById('toggle').onclick=()=>document.getElementById('side').classList.toggle('open');map.on('click',()=>{if(innerWidth<=760)document.getElementById('side').classList.remove('open')});
</script>
</body>
</html>
